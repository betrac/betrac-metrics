[project]
name = "btc-eval"
version = "0.1.0"
description = "BeTraC 2026 evaluation harness — Open Medical Concept F1 and ROUGE scoring for clinical SOAP note summaries"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
keywords = ["medical", "evaluation", "NLP", "clinical", "MeSH", "SOAP notes", "F1"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.21,<2",
]

[project.optional-dependencies]
scispacy = [
    "spacy>=3.7,<4",
    "scispacy>=0.5.4",
    "thinc>=8.3,<9",
]
rouge = [
    "rouge-score>=0.1,<1",
]
hf = [
    "datasets>=2.0,<5",
]
llm-judge = [
    "requests>=2.28,<3",
    "json-repair>=0.30,<1",  # lenient fallback for truncated/glitched judge JSON
]
llm-bedrock = [
    "boto3>=1.34,<2",
]
llm-anthropic = [
    "anthropic>=0.40,<1",
]
dev = [
    "pytest>=7.0,<10",
    "ruff>=0.4,<1",
]
all = [
    "btc-eval[rouge,scispacy,hf,llm-judge,llm-bedrock,llm-anthropic]",
]

[project.scripts]
btc-eval = "btc_eval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/btc_eval"]

[tool.ruff]
line-length = 100
